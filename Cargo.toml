[package]
name = "sekuire-cli"
version = "0.2.10"
edition = "2021"
license = "Apache-2.0"
description = "CLI for the Sekuire Agent Identity Protocol"
authors = ["Sekuire Inc <support@sekuire.com>"]
repository = "https://github.com/sekuire/sekuire"
homepage = "https://sekuire.com"
keywords = ["ai", "agents", "governance", "cli", "identity"]
categories = ["command-line-utilities", "authentication"]
readme = "README.md"
default-run = "sekuire"

[[bin]]
name = "sekuire"
path = "src/main.rs"

[dependencies]
sekuire-protocol = "0.1"
# sekuire-sdk = { path = "../sdk" }  # Temporarily disabled - only needed for verify command
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tera = "1.19"
rust-embed = "8"
reqwest = { version = "0.11", features = ["json"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pem"] }
rand = "0.8"
hex = "0.4"
dirs = "5.0"
blake3 = "1.5"
sha2 = "0.10"
sysinfo = "0.30"
rpassword = "7.0"
dialoguer = "0.11"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
urlencoding = "2.1"
webbrowser = "0.8"
shell-words = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }

[package.metadata.deb]
maintainer = "Sekuire Team <support@sekuire.com>"
copyright = "2024, Sekuire <support@sekuire.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Sekuire CLI provides the command-line interface for the Sekuire Trust Protocol,
the identity layer for AI agents. Use it to create, manage, and verify
cryptographic identities for autonomous agents."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/sekuire", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sekuire/", "644"],
]
